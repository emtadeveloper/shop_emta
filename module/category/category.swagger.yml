tags:
  - name: Category
    description: Operations related to product categories

components:
  schemas:
    MessageObject:
      type: object
      properties:
        fa:
          type: string
          example: "عملیات با موفقیت انجام شد"
        en:
          type: string
          example: "Operation completed successfully"
        status:
          type: integer
          example: 200

    CategoryFilterOption:
      type: object
      required: [name, slug, type]
      properties:
        name:
          type: string
          example: "رنگ"
        slug:
          type: string
          example: "color"
        description:
          type: string
          example: "انتخاب رنگ محصول"
        type:
          type: string
          enum: [radio, selectbox]
          example: "radio"
        options:
          type: array
          items:
            type: string
          example: ["قرمز", "آبی", "سبز"]
        min:
          type: number
          example: 0
        max:
          type: number
          example: 100

    Category:
      type: object
      properties:
        _id:
          type: string
          example: "661fe66f8dd69e50c8e866d1"
        name:
          type: string
          example: "لباس مردانه"
        slug:
          type: string
          example: "mens-clothing"
        icon:
          type: string
          example: "fa-shirt"
        description:
          type: string
          example: "دسته‌بندی لباس مردانه"
        parent:
          type: string
          nullable: true
          example: "661fe66f8dd69e50c8e866d0"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/CategoryFilterOption"

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          example: "لباس زنانه"
        slug:
          type: string
          example: "womens-clothing"
        icon:
          type: string
          format: binary
          description: "Icon image file to upload"
        description:
          type: string
          example: "دسته‌بندی لباس زنانه"
        parent:
          type: string
          nullable: true
          description: "شناسه دسته‌بندی والد"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/CategoryFilterOption"

    CategoryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          $ref: "#/components/schemas/Category"

    CategoryListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    GenericSuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"

paths:
  /api/v1/category:
    get:
      summary: Get all categories
      tags: [Category]
      description: Retrieve a list of all available product categories
      responses:
        200:
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"

    post:
      summary: Create a new category
      tags: [Category]
      description: Create a new product category with optional icon upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        201:
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"

  /api/v1/category/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of the category

    get:
      summary: Get category by ID
      tags: [Category]
      description: Retrieve a single category by its unique ID
      responses:
        200:
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"

    put:
      summary: Update category by ID
      tags: [Category]
      description: Update an existing category's information and optionally update the icon
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        200:
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"

    delete:
      summary: Delete category by ID
      tags: [Category]
      description: Delete an existing category using its unique ID
      responses:
        200:
          description: Category deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessMessage"
