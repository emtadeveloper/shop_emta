paths:
  /api/v1/captcha/{id}:
    get:
      tags:
        - Captcha
      summary: Get captcha based on the ID
      description: Retrieve the captcha image for username or email.
      parameters:
        - in: path
          name: id
          required: true
          description: The user identifier (e.g., username or email)
          schema:
            type: string
      responses:
        "200":
          description: Successfully generated captcha image
          content:
            image/svg+xml:
              schema:
                type: string
                example: "<svg xmlns='http://www.w3.org/2000/svg' width='120' height='40'><text x='10' y='25' font-size='20'>AB12</text></svg>"
