tags:
  - name: User
    description: Operations related to user profiles, addresses, and avatars

components:
  schemas:
    MessageObject:
      type: object
      properties:
        fa:
          type: string
          example: "عملیات با موفقیت انجام شد"
        en:
          type: string
          example: "Operation completed successfully"
        status:
          type: integer
          example: 200

    Location:
      type: object
      properties:
        lat:
          type: number
          example: 36.1234
        lng:
          type: number
          example: 52.4567

    Address:
      type: object
      properties:
        _id:
          type: string
          example: "60d0fe4f5311236168a109cb"
        type:
          type: string
          enum: [home, work, other]
          example: "home"
        postalCode:
          type: string
          example: "9876543210"
        address:
          type: string
          example: "Boulevard Kashavarz, No. 50"
        cityId:
          type: integer
          example: 110
        location:
          $ref: "#/components/schemas/Location"

    AddressInput:
      type: object
      required: [type, postalCode, address, cityId, location]
      properties:
        type:
          type: string
          enum: [home, work, other]
          example: "home"
        postalCode:
          type: string
          example: "9876543210"
        address:
          type: string
          example: "Boulevard Kashavarz, No. 50"
        cityId:
          type: integer
          example: 110
        location:
          $ref: "#/components/schemas/Location"

    UserAddressesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          type: object
          properties:
            addresses:
              type: array
              items:
                $ref: "#/components/schemas/Address"

    UserAddressResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          $ref: "#/components/schemas/Address"

    UserProfileInput:
      type: object
      properties:
        firstName:
          type: string
          example: "علی"
        lastName:
          type: string
          example: "رضایی"
        phone:
          type: string
          pattern: '^09\\d{9}$'
          example: "09123456789"
        email:
          type: string
          format: email
          example: "ali.rezaei@example.com"
        username:
          type: string
          minLength: 3
          example: "alirezaei"

    Role:
      type: object
      properties:
        roleName:
          type: string
          example: "admin"
        permissions:
          type: array
          items:
            type: integer
          example: [1, 2, 3, 4, 5, 6]

    UserProfile:
      type: object
      properties:
        phone:
          type: string
          example: "09154144503"
        username:
          type: string
          example: "alirezayi"
        email:
          type: string
          example: "emta137671@gmail.com"
        firstName:
          type: string
          example: "Ali"
        lastName:
          type: string
          example: "Rezayi"
        role:
          $ref: "#/components/schemas/Role"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        createdAt:
          type: string
          format: date-time
          example: "2025-04-19T04:41:49.867Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-04-19T04:41:49.867Z"

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          $ref: "#/components/schemas/UserProfile"

    AvatarData:
      type: object
      properties:
        avatarUrl:
          type: string
          format: uri
          example: "https://cdn.example.com/avatars/user123.jpg"
        public_id:
          type: string
          example: "avatars/user123"

    AvatarResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          $ref: "#/components/schemas/AvatarData"

    GenericSuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"

/api/v1/user/address:
  get:
    summary: Retrieve all user addresses
    tags: [User]
    description: Get the list of all addresses saved for the authenticated user
    responses:
      200:
        description: Addresses retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAddressesResponse"
  post:
    summary: Create a new user address
    tags: [User]
    description: Create a new address for the authenticated user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AddressInput"
    responses:
      201:
        description: Address created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAddressesResponse"

/api/v1/user/address/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID of the address
  get:
    summary: Retrieve a specific user address
    tags: [User]
    description: Get the details of a single address by its ID
    responses:
      200:
        description: Address retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAddressResponse"
  put:
    summary: Update a specific user address
    tags: [User]
    description: Update the information of a specific address based on its ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AddressInput"
    responses:
      200:
        description: Address updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAddressesResponse"
  delete:
    summary: Delete a specific user address
    tags: [User]
    description: Delete a specific address based on its ID
    responses:
      200:
        description: Address deleted successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericSuccessMessage"

/api/v1/user:
  get:
    summary: Get user profile
    tags: [User]
    description: Get the authenticated user's profile using access token
    responses:
      200:
        description: User profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileResponse"
  put:
    summary: Update user profile
    tags: [User]
    description: Update one or more fields in the user’s profile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserProfileInput"
    responses:
      200:
        description: Profile updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileResponse"

/api/v1/user/avatar:
  post:
    summary: Upload or update user avatar
    tags: [User]
    description: Upload a new avatar image for the authenticated user
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              avatar:
                type: string
                format: binary
                description: The avatar image file (jpeg, png)
    responses:
      200:
        description: Avatar uploaded successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarResponse"
  get:
    summary: Get user avatar
    tags: [User]
    description: Retrieve the current avatar information for the authenticated user
    responses:
      200:
        description: Avatar fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarResponse"
  delete:
    summary: Delete user avatar
    tags: [User]
    description: Remove the current avatar for the authenticated user
    responses:
      200:
        description: Avatar deleted successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericSuccessMessage"
