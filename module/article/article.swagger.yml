tags:
  - name: Article
    description: Operations for creating, retrieving and managing articles

components:
  schemas:
    MessageObject:
      type: object
      properties:
        fa:
          type: string
          example: "Operation completed successfully"
        en:
          type: string
          example: "Operation completed successfully"
        status:
          type: integer
          example: 200

    ContentTextInput:
      type: object
      properties:
        type:
          type: string
          enum: [text]
          example: text
        content:
          type: string
          example: "This is a paragraph of the article."
        order:
          type: integer
          example: 0
      required:
        - type
        - content
        - order

    ContentImageInput:
      type: object
      properties:
        type:
          type: string
          enum: [image]
          example: image
        file:
          type: string
          format: binary
          description: Image block (uploaded by user)
        meta:
          type: object
          properties:
            caption:
              type: string
              example: "Section cover"
            altText:
              type: string
              example: "Alternative text for image"
        order:
          type: integer
          example: 1
      required:
        - type
        - file
        - order

    ContentVideoInput:
      type: object
      properties:
        type:
          type: string
          enum: [video]
          example: video
        file:
          type: string
          format: binary
          description: Video block (uploaded by user)
        meta:
          type: object
          properties:
            caption:
              type: string
              example: "Introduction video"
            altText:
              type: string
              example: "Alternative text for video"
        order:
          type: integer
          example: 2
      required:
        - type
        - file
        - order

    ArticleCreate:
      type: object
      properties:
        title:
          type: string
          example: "Complete Guide to Creating a Blog with Node.js"
        categories:
          type: array
          items:
            type: string
            format: uuid
          example: ["60d5f0c5a2e8b4251c9e72fa"]
        tags:
          type: array
          items:
            type: string
          example: ["Node.js", "Express"]
        excerpt:
          type: string
          example: "Article excerpt..."
        featuredImage:
          type: string
          format: binary
        contents:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/ContentTextInput"
              - $ref: "#/components/schemas/ContentImageInput"
              - $ref: "#/components/schemas/ContentVideoInput"
      required:
        - title
        - contents
      encoding:
        contents:
          contentType: application/json
        featuredImage:
          contentType: image/jpeg, image/png
        "contents[].file":
          contentType: image/jpeg, image/png, video/mp4

    Article:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        categories:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
        approval:
          type: object
        contents:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/ContentTextInput"
              - $ref: "#/components/schemas/ContentImageInput"
              - $ref: "#/components/schemas/ContentVideoInput"
        featuredImage:
          type: object
          properties:
            public_id:
              type: string
            imageUrl:
              type: string
        viewsCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

paths:
  /api/v1/articles:
    post:
      tags:
        - Article
      summary: Create new article with text, image and video blocks
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ArticleCreate"
      responses:
        "201":
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
    get:
      tags:
        - Article
      summary: Create new article with text, image and video blocks
      responses:
        "201":
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
