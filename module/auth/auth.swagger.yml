paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - phone
                - email
                - username
                - password
              properties:
                firstName:
                  type: string
                  example: "Ali"
                lastName:
                  type: string
                  example: "Rezayi"
                phone:
                  type: string
                  example: "09154144503"
                email:
                  type: string
                  example: "emta137671@gmail.com"
                username:
                  type: string
                  example: "alirezayi"
                password:
                  type: string
                  example: "securePassword123"
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: object
                    properties:
                      fa:
                        type: string
                        example: "ثبت‌نام با موفقیت انجام شد"
                      en:
                        type: string
                        example: "User registered successfully"
                      status:
                        type: integer
                        example: 201
                  data:
                    type: object
                    example: {}

  /api/v1/auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
              properties:
                login:
                  type: string
                  example: "alirezayi"
                captcha:
                  type: string
                  example: "1234535"
                captchaKey:
                  type: string
                  example: "345435435435345"
                password:
                  type: string
                  example: "securePassword123"
      responses:
        200:
          description: User login successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: object
                    properties:
                      fa:
                        type: string
                        example: "ورود با موفقیت انجام شد"
                      en:
                        type: string
                        example: "Login successful"
                      status:
                        type: integer
                        example: 200
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  /api/v1/auth/send-otp:
    post:
      summary: Send OTP code to email or mobile number
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
              properties:
                identifier:
                  type: string
                  description: ایمیل یا شماره موبایل کاربر
                  example: "09123456789"
      responses:
        200:
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: object
                    properties:
                      fa:
                        type: string
                        example: "کد OTP با موفقیت ارسال شد"
                      en:
                        type: string
                        example: "OTP sent successfully"
                      status:
                        type: integer
                        example: 200
                  data:
                    type: object
                    example: {}