tags:
  - name: Auth
    description: Endpoints for user registration, login, and OTP operations

securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT

paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      description: Create a new user account with provided details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterInput"
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterResponse"

  /api/v1/auth/login:
    post:
      summary: Login user
      tags: [Auth]
      description: Authenticate user with username/email/phone and password, return JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        200:
          description: User login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokensResponse"

  /api/v1/auth/send-otp:
    post:
      summary: Send OTP code
      tags: [Auth]
      description: Send a one-time password (OTP) to user's email or mobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSendOtpInput"
      responses:
        200:
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSendOtpResponse"

  /api/v1/auth/verify-otp:
    post:
      summary: Verify OTP code
      tags: [Auth]
      description: Verify the one-time password and issue JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifyOtpInput"
      responses:
        200:
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokensResponse"

  /api/v1/auth/refresh-token:
    post:
      summary: Refresh JWT tokens
      tags: [Auth]
      description: Generate a new access token using a valid refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshInput"
      responses:
        200:
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokensResponse"

  /api/v1/auth/forgot-password:
    post:
      summary: Send password reset link
      tags: [Auth]
      description: Send a password reset link to the user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthForgotPasswordInput"
      responses:
        200:
          description: Password reset link sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthForgotPasswordResponse"

  /api/v1/auth/reset-password/{token}:
    post:
      summary: Reset user password
      tags: [Auth]
      description: Reset the user's password using the provided reset token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Password reset token provided in reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResetPasswordInput"
      responses:
        200:
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResetPasswordResponse"

  /api/v1/user:
    get:
      summary: Get user profile
      tags: [User]
      description: Get the authenticated user's profile using access token
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
    put:
      summary: Update user profile
      tags: [User]
      description: Update one or more fields in the user’s profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        200:
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"

  /api/v1/user/password:
    put:
      summary: Change user password
      tags: [User]
      description: Update the current password to a new password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        200:
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessMessage"

  /api/v1/user/avatar:
    post:
      summary: Upload or update user avatar
      tags: [User]
      description: Upload a new avatar image for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: The avatar image file (jpeg, png)
      responses:
        200:
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"
    get:
      summary: Get user avatar
      tags: [User]
      description: Retrieve the current avatar information for the authenticated user
      security:
        - bearerAuth: []
      responses:
        200:
          description: Avatar fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"
    delete:
      summary: Delete user avatar
      tags: [User]
      description: Remove the current avatar for the authenticated user
      security:
        - bearerAuth: []
      responses:
        200:
          description: Avatar deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessMessage"

components:
  schemas:
    MessageObject:
      type: object
      properties:
        fa:
          type: string
          example: "عملیات با موفقیت انجام شد"
        en:
          type: string
          example: "Operation completed successfully"
        status:
          type: integer
          example: 200

    AuthRegisterInput:
      type: object
      required: [firstName, lastName, phone, email, username, password]
      properties:
        firstName:
          type: string
          example: "Ali"
        lastName:
          type: string
          example: "Rezayi"
        phone:
          type: string
          example: "09154144503"
        email:
          type: string
          format: email
          example: "emta137671@gmail.com"
        username:
          type: string
          example: "alirezayi"
        password:
          type: string
          format: password
          example: "securePassword123"

    AuthRegisterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          $ref: "#/categories/schemas/UserProfile"

    AuthLoginInput:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Username or email or phone
          example: "alirezayi"
        password:
          type: string
          format: password
          example: "securePassword123"

    AuthSendOtpInput:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: User's email or mobile number
          example: "emta137671@gmail.com"

    AuthVerifyOtpInput:
      type: object
      required: [code, identifier]
      properties:
        code:
          type: string
          example: "123456"
          description: The one-time password sent to user
        identifier:
          type: string
          example: "emta137671@gmail.com"
          description: User's email or mobile number

    AuthRefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: "your-refresh-token-here"

    AuthForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"

    AuthResetPasswordInput:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          example: "newSecurePass123"

    AuthTokensResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: "eyJhbGciOi..."
            refreshToken:
              type: string
              example: "eyJhbGciOi..."

    AuthSendOtpResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          type: object
          properties:
            otpSecret:
              type: string
              example: "726787"

    AuthForgotPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          type: object
          properties:
            email:
              type: string
              example: "user@example.com"

    AuthResetPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          type: object
          properties:
            email:
              type: string
              example: "user@example.com"

    Location:
      type: object
      properties:
        lat:
          type: number
          example: 36.1234
        lng:
          type: number
          example: 52.4567

    Address:
      type: object
      properties:
        _id:
          type: string
          example: "60d0fe4f5311236168a109cb"
        type:
          type: string
          enum: [home, work, other]
          example: "home"
        postalCode:
          type: string
          example: "9876543210"
        address:
          type: string
          example: "Boulevard Kashavarz, No. 50"
        cityId:
          type: integer
          example: 110
        location:
          $ref: "#/components/schemas/Location"

    AddressInput:
      type: object
      required: [type, postalCode, address, cityId, location]
      properties:
        type:
          type: string
          enum: [home, work, other]
          example: "home"
        postalCode:
          type: string
          example: "9876543210"
        address:
          type: string
          example: "Boulevard Kashavarz, No. 50"
        cityId:
          type: integer
          example: 110
        location:
          $ref: "#/components/schemas/Location"

    UserAddressesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          type: object
          properties:
            addresses:
              type: array
              items:
                $ref: "#/components/schemas/Address"

    UserAddressResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          $ref: "#/components/schemas/Address"

    UserProfileInput:
      type: object
      properties:
        firstName:
          type: string
          example: "علی"
        lastName:
          type: string
          example: "رضایی"
        phone:
          type: string
          pattern: '^09\\d{9}$'
          example: "09123456789"
        email:
          type: string
          format: email
          example: "ali.rezaei@example.com"
        username:
          type: string
          minLength: 3
          example: "alirezaei"

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          type: object
          properties:
            phone:
              type: string
              example: "09154144503"
            username:
              type: string
              example: "alirezayi"
            email:
              type: string
              example: "emta137671@gmail.com"
            firstName:
              type: string
              example: "Ali"
            lastName:
              type: string
              example: "Rezayi"
            role:
              $ref: "#/components/schemas/Role"
            addresses:
              type: array
              items:
                $ref: "#/components/schemas/Address"
            createdAt:
              type: string
              format: date-time
              example: "2025-04-19T04:41:49.867Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-04-19T04:41:49.867Z"

    Role:
      type: object
      properties:
        roleName:
          type: string
          example: "admin"
        permissions:
          type: array
          items:
            type: integer
          example: [1, 2, 3, 4, 5, 6]

    PasswordChangeInput:
      type: object
      required: [currentPassword, newPassword, confirmNewPassword]
      properties:
        currentPassword:
          type: string
          minLength: 6
        newPassword:
          type: string
          minLength: 6
        confirmNewPassword:
          type: string
          minLength: 6

    AvatarData:
      type: object
      properties:
        avatarUrl:
          type: string
          format: uri
          example: "https://cdn.example.com/avatars/user123.jpg"
        public_id:
          type: string
          example: "avatars/user123"

    AvatarResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
        data:
          $ref: "#/components/schemas/AvatarData"

    GenericSuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          $ref: "#/components/schemas/MessageObject"
